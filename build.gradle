allprojects {
    group = 'gg.warcraft'
    version = '1.0.0-SNAPSHOT'

    apply plugin: 'java'

    sourceCompatibility = 1.8

    repositories {
        mavenLocal()
        mavenCentral()
    }

    dependencies {
        compile 'com.google.inject:guice:4.2.0'
        compile 'com.google.inject.extensions:guice-assistedinject:4.2.0'

        testCompile 'junit:junit:4.12'
    }
}
